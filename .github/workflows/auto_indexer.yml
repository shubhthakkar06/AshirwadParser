name: Auto-Scan & Index BAPS Discourses

on:
  schedule:
    # Runs automatically every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  index-discourses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (ffmpeg for audio analysis)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Indexer Scan
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          PLAYLIST_URL: "https://www.youtube.com/playlist?list=PLOX7n0cygMYA19eaokQqliIzEhz--1BoK"
          RUN_ONCE: "true"
        run: |
          python indexer.py --once

      - name: Commit and push changes if new videos were indexed
        run: |
          git config --global user.name "BAPS Auto-Indexer Bot"
          git config --global user.email "bot@ashirwadparser.local"
          git add baps_video_index.json
          git diff-index --quiet HEAD || (git commit -m "chore(database): auto-indexed new BAPS discourses [skip ci]" && git push)
